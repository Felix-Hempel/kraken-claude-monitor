[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kraken-claude-monitor"
version = "0.1.0"
description = "Live Claude-Code-Quota auf NZXT Kraken 2023 LCD anzeigen"
requires-python = ">=3.11"
readme = "README.md"
authors = [{name = "Felix Hempel"}]
dependencies = [
    "liquidctl>=1.14",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
kraken-monitor = "kraken_monitor.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
